            <div class="kv-item"><span>连涨累计</span><b class="${pctClass(normalizeNumber(item['连续涨跌幅']))}">${item['连续涨跌幅'] || '--'}</b></div>
            <div class="kv-item"><span>平均涨幅/天</span><b>${avgPct.toFixed(2)}%</b></div>
            <div class="kv-item"><span>平均换手/天</span><b>${avgTurnover.toFixed(2)}%</b></div>
            <div class="kv-item" style="grid-column: 1 / -1;"><span>榜单收盘价</span><b>${item['收盘价(元)'] || '--'} 元</b></div>
          </div>
        </div>

        <div>
          <div class="drawer-section-title">💡 资金情绪与估值</div>
          <div class="kv-card">
            <div class="kv-item">
              <span>散户指数 (小单占比)</span>
              <b class="${pctClass(retail ?? 0)}">${item['散户指数'] || '--'}</b>
            </div>
            <div class="kv-item">
              <span>散户净额</span>
              <b>${item['散户净额'] || '--'}</b>
            </div>
            <div class="kv-item"><span>市盈率 (PE)</span><b>${item['市盈率'] || '--'}</b></div>
            <div class="kv-item"><span>行情更新时刻</span><b>${item['行情时间'] || '--'}</b></div>
            ${retailTrend ? `<div class="kv-item" style="grid-column:1 / -1;"><span style="color:var(--text-sub);">${retailTrend}</span></div>` : ''}
          </div>
        </div>

        <div class="acts">
          <a class="primary" href="${buildDetailUrl(item['股票代码'])}" target="_blank" rel="noopener">
            打开东财行情
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
          </a>
          <button type="button" id="copyCodeBtn">复制代码</button>
        </div>
        <div class="hint">按 Esc 键或点击外部遮罩退出详情</div>`;

      drawer.classList.add('open');
      mask.classList.add('open');
      drawer.setAttribute('aria-hidden', 'false');

      const closeBtn = document.getElementById('drawerCloseBtn');
      if (closeBtn) closeBtn.onclick = closeDrawer;

      const copyBtn = document.getElementById('copyCodeBtn');
      if (copyBtn) copyBtn.onclick = async () => {
        try {
          await navigator.clipboard.writeText(item['股票代码']);
          copyBtn.textContent = '✓ 已复制';
          setTimeout(() => { if (copyBtn) copyBtn.textContent = '复制代码'; }, 1800);
        } catch {
          copyBtn.textContent = item['股票代码'];
        }
      };

      document.querySelectorAll('[data-code]').forEach(el => el.classList.toggle('active', el.getAttribute('data-code') === code));
    }

    function closeDrawer() {
      selectedCode = null;
      drawer.classList.remove('open');
      mask.classList.remove('open');
      drawer.setAttribute('aria-hidden', 'true');
      document.querySelectorAll('[data-code]').forEach(el => el.classList.remove('active'));
    }

    function handleChange() {
      const filtered = filterData();
      if (resultCount) {
        resultCount.innerHTML = `符合条件 <b>${filtered.length}</b> / ${data.length} 只`;
      }
      renderDayPills(filtered);
      renderIndustryPills();
      render(filtered);
    }

    function applySnapshot(payload) {
      data = Array.isArray(payload.rows) ? payload.rows : [];
      industries = Array.isArray(payload.industries) ? payload.industries : [];
      const timeText = payload.updated_at || '尚未刷新';
      const refreshedAt = document.getElementById('refreshedAt');
      if (refreshedAt) {
        refreshedAt.textContent = timeText;
        refreshedAt.classList.remove('just-updated');
        void refreshedAt.offsetWidth;
        refreshedAt.classList.add('just-updated');
      }
      const kpiTotal = document.getElementById('kpiTotal');
      if (kpiTotal) kpiTotal.innerHTML = `${payload.count || 0} <small>只</small>`;
      const kpiMaxDays = document.getElementById('kpiMaxDays');
      if (kpiMaxDays) kpiMaxDays.innerHTML = `${payload.max_days || 0} <small>天</small>`;
      const kpiQuoteAt = document.getElementById('kpiQuoteAt');
      if (kpiQuoteAt) kpiQuoteAt.textContent = payload.quote_at || '--';
      const kpiGeneratedAt = document.getElementById('kpiGeneratedAt');
      if (kpiGeneratedAt) kpiGeneratedAt.textContent = timeText;
      if (daysRange) {
        daysRange.max = String(payload.max_days || 0);
        if (Number(daysRange.value) > Number(daysRange.max)) {
          daysRange.value = '0';
          if (daysValue) daysValue.textContent = '0';
        }
      }
      if (industrySelect) {
        const current = industrySelect.value || 'all';
        industrySelect.innerHTML = ['<option value="all">全部行业</option>', ...industries.map(item => `<option value="${item}">${item}</option>`)].join('');
        industrySelect.value = current === 'all' || industries.includes(current) ? current : 'all';
      }
      handleChange();
      if (selectedCode) {
        if (data.some(item => item['股票代码'] === selectedCode)) openDrawer(selectedCode);
        else closeDrawer();
      }
    }

    document.getElementById('dayPills').addEventListener('click', (e) => {
      const btn = e.target.closest('.day-chip');
      if (!btn) return;
      exactDay = btn.dataset.day === '' ? null : Number(btn.dataset.day);
      syncChips();
      handleChange();
    });
    document.getElementById('industryPills').addEventListener('click', (e) => {
      const btn = e.target.closest('.ind-chip');
      if (!btn) return;
      industrySelect.value = btn.dataset.ind;
      syncChips();
      handleChange();
    });
    container.addEventListener('click', (e) => {
      const el = e.target.closest('[data-code]');
      if (!el) return;
      openDrawer(el.getAttribute('data-code'));
    });
    mask.addEventListener('click', closeDrawer);
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeDrawer();
      if (e.key === '/' && !['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement.tagName)) {
        e.preventDefault();
        keywordInput.focus();
        keywordInput.select();
      }
      if (e.key === '1' && !['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement.tagName)) {
        const btn = document.querySelector('#viewSeg button[data-view="cards"]');
        if (btn) btn.click();
      }
      if (e.key === '2' && !['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement.tagName)) {
        const btn = document.querySelector('#viewSeg button[data-view="list"]');
        if (btn) btn.click();
      }
    });

    initFilters();
    syncChips();
    handleChange();
  </script>
</body>
</html>
