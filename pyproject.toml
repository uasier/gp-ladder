[project]
name = "gp"
version = "0.1.0"
description = "爬取同花顺连涨股票榜单并输出 CSV / JSON / HTML"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1.0",
    "gunicorn>=23.0.0",
    "requests>=2.34.2",
]

[project.scripts]
gp = "gp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gp"]

[tool.hatch.build]
include = ["src/gp/templates/*"]

[tool.uv]
package = true
