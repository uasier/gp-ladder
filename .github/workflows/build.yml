name: Build

# 本仓库的安装包编译只在 GitHub 上跑，避免本机生成数 GB 的 target/。
# - 推送 v* tag：编译并上传到该 GitHub Release
# - 手动 Run workflow：默认只上传 Actions Artifacts；填 release_tag 则额外挂到已有 Release
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "上传到已有 GitHub Release（如 v0.2.0）。留空则只作为 Actions 产物，不创建/更新 Release。"
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}-${{ github.event.inputs.release_tag || github.run_id }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    name: Verify version
    outputs:
      publish_tag: ${{ steps.meta.outputs.tag }}
      publish_name: ${{ steps.meta.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve publish tag
        id: meta
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          TAG=""
          if [[ "$REF" == refs/tags/v* ]]; then
            TAG="$REF_NAME"
          elif [[ -n "$INPUT_TAG" ]]; then
            TAG="$INPUT_TAG"
          fi
          if [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            TAG="v$TAG"
          fi
          if [[ -n "$TAG" && ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "非法 tag: $TAG（需要 vX.Y.Z）" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [[ -n "$TAG" ]]; then
            echo "name=连涨天梯 v__VERSION__" >> "$GITHUB_OUTPUT"
          else
            echo "name=" >> "$GITHUB_OUTPUT"
          fi
          echo "publish_tag=${TAG:-<artifacts-only>}"

      - name: Check version files match tag
        env:
          PUBLISH_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          if [[ -n "$PUBLISH_TAG" ]]; then
            node scripts/sync-version.mjs --check --tag "$PUBLISH_TAG"
          else
            node scripts/sync-version.mjs --check
          fi

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            name: macOS-arm64
            args: --target aarch64-apple-darwin --bundles app,dmg
            rust_targets: aarch64-apple-darwin
          - platform: macos-latest
            name: macOS-x64
            args: --target x86_64-apple-darwin --bundles app,dmg
            rust_targets: x86_64-apple-darwin
          - platform: windows-latest
            name: Windows-x64
            args: --bundles nsis
            rust_targets: ""

    runs-on: ${{ matrix.platform }}
    name: Build ${{ matrix.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.name }}

      - name: Install frontend deps
        run: npm ci

      - name: Test frontend
        run: npm test

      # Windows 上 Tauri cdylib 的 cargo test 会 STATUS_ENTRYPOINT_NOT_FOUND，与产品功能无关
      - name: Test rust
        if: runner.os != 'Windows'
        run: npm run test:rust

      # tagName / releaseName 都为空时 tauri-action 只编译，不创建或更新 GitHub Release
      - name: Build and upload
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          tauriScript: npm run tauri
          args: ${{ matrix.args }}
          tagName: ${{ needs.verify.outputs.publish_tag }}
          releaseName: ${{ needs.verify.outputs.publish_name }}
          releaseBody: |
            同花顺连涨榜桌面工作台。打开只读本地快照；点击「刷新实时数据」才会联网。

            ## 安装包
            - macOS Apple Silicon：`gp-ladder_*_aarch64.dmg`
            - macOS Intel：`gp-ladder_*_x64.dmg`
            - Windows 64 位：`gp-ladder_*_x64-setup.exe`
            - Android arm64：`gp-ladder_*_aarch64.apk`

            安装包未做 Apple / Microsoft 公证。macOS 15+ 若提示「文件已损坏」，不是下载坏了：把 App 拖到「应用程序」后执行
            `xattr -cr /Applications/连涨天梯.app && codesign --force --deep --sign - /Applications/连涨天梯.app && open /Applications/连涨天梯.app`。
            Windows 如遇 SmartScreen，选择「仍要运行」；Android 需允许安装未知来源。

            应用内「设置 → 关于」可检查更新并下载当前系统对应安装包。
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: false
          # GitHub Release 资源名用 ASCII，避免中文产品名被剥成 `_0.1.0_*.dmg`
          releaseAssetNamePattern: gp-ladder_[version]_[arch][setup][ext]
          retryAttempts: 2

      # Apple Silicon 链接器会给可执行文件打临时签名，但不密封 .app 资源。
      # 未设置 signingIdentity 时，macOS 15+ 会把下载的 App 提示成「文件已损坏」。
      - name: Verify macOS ad-hoc signature
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          TARGET="${{ matrix.rust_targets }}"
          if [ -n "$TARGET" ]; then
            APP="src-tauri/target/${TARGET}/release/bundle/macos/连涨天梯.app"
          else
            APP="src-tauri/target/release/bundle/macos/连涨天梯.app"
          fi
          echo "app=$APP"
          test -d "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=2 "$APP" 2>&1 | tee /tmp/codesign-app.txt
          grep -q "Signature=adhoc" /tmp/codesign-app.txt
          grep -q "Sealed Resources version=2" /tmp/codesign-app.txt
          if grep -q "Sealed Resources=none" /tmp/codesign-app.txt; then
            echo "App bundle 未密封资源，Gatekeeper 会提示文件损坏" >&2
            exit 1
          fi

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gp-ladder-${{ matrix.name }}
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/macos/*.app.tar.gz
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/msi/*.msi
          if-no-files-found: warn
          retention-days: 14

  android:
    needs: verify
    runs-on: ubuntu-latest
    name: Build Android-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Google 已下架旧的 `tools` 包；v3 默认仍会安装它并失败
          packages: platform-tools

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          link-to-sdk: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: Android-arm64

      - name: Install frontend deps
        run: npm ci

      - name: Test frontend
        run: npm test

      - name: Init Android project
        run: |
          if [ ! -f src-tauri/gen/android/settings.gradle ] && [ ! -f src-tauri/gen/android/settings.gradle.kts ]; then
            npx tauri android init --ci
          fi

      - name: Create debug keystore for sideload APK
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build APK
        run: npx tauri android build --apk --target aarch64

      - name: Collect APK
        run: |
          mkdir -p dist-android
          VER="$(node -p "require('./package.json').version")"
          SRC=""
          while IFS= read -r f; do
            case "$f" in
              *unsigned*) continue ;;
            esac
            SRC="$f"
            break
          done < <(find src-tauri/gen/android/app/build/outputs/apk src-tauri/target -name "*.apk" 2>/dev/null)
          if [ -z "$SRC" ]; then
            SRC="$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -n 1)"
          fi
          test -n "$SRC"
          cp "$SRC" "dist-android/gp-ladder_${VER}_aarch64.apk"
          ls -la dist-android

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gp-ladder-Android-arm64
          path: dist-android/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload APK to GitHub Release
        if: needs.verify.outputs.publish_tag != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.verify.outputs.publish_tag }}
        run: gh release upload "$TAG" dist-android/*.apk --clobber
