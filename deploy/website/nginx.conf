worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  server_tokens off;
  sendfile on;
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

  server {
    listen 127.0.0.1:40501 ssl;
    http2 on;
    server_name gp.uasier.com;
    ssl_certificate /etc/nginx/tls/gp.uasier.com_bundle.crt;
    ssl_certificate_key /etc/nginx/tls/gp.uasier.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:GPSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;

    location / {
      proxy_pass http://127.0.0.1:40500;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      # TLS arrives through the existing SNI stream proxy, which does not pass the client IP.
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Connection "";
      proxy_connect_timeout 5s;
      proxy_read_timeout 20s;
    }
  }
}
