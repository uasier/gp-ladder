<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>连涨天梯 GitHub social</title>
    <style>
      html,
      body {
        margin: 0;
        width: 1280px;
        height: 640px;
        overflow: hidden;
      }
      body {
        box-sizing: border-box;
        display: flex;
        align-items: center;
        padding: 64px 80px;
        color: #f8fafc;
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
          "Microsoft YaHei", sans-serif;
        background: #0b0f17;
        background-image: radial-gradient(
            980px circle at 10% -8%,
            rgba(56, 189, 248, 0.16),
            transparent 42%
          ),
          radial-gradient(860px circle at 92% 8%, rgba(99, 102, 241, 0.18), transparent 46%);
      }
      .icon {
        width: 176px;
        height: 176px;
        border-radius: 40px;
        background: #151d2c;
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
      }
      .copy {
        margin-left: 56px;
      }
      .eyebrow {
        margin: 0 0 12px;
        color: #94a3b8;
        font-size: 22px;
        letter-spacing: 0.16em;
      }
      h1 {
        margin: 0 0 16px;
        font-size: 88px;
        line-height: 1;
        letter-spacing: 0.06em;
        font-weight: 700;
      }
      p {
        margin: 0 0 28px;
        color: #cbd5e1;
        font-size: 28px;
      }
      .pills {
        display: flex;
        gap: 12px;
      }
      .pill {
        padding: 8px 16px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.04);
        color: #e2e8f0;
        font-size: 22px;
      }
    </style>
  </head>
  <body>
    <img class="icon" src="../public/app-icon.png" alt="" />
    <div class="copy">
      <p class="eyebrow">GITHUB.COM/UASIER/GP-LADDER</p>
      <h1>连涨天梯</h1>
      <p>同花顺连涨榜 · 东方财富涨停天梯 · 昨日涨停</p>
      <div class="pills">
        <span class="pill">macOS</span>
        <span class="pill">Windows</span>
        <span class="pill">Android</span>
        <span class="pill">开源免费</span>
      </div>
    </div>
  </body>
</html>
