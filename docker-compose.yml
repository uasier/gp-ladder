services:
  gp:
    build: .
    container_name: gp
    ports:
      - "${GP_HOST_PORT:-8000}:8000"
    environment:
      GP_PASSWORD: ${GP_PASSWORD:-uasier}
      GP_SECRET_KEY: ${GP_SECRET_KEY:-change-this-session-key}
      TZ: ${TZ:-Asia/Shanghai}
      GP_CACHE_PATH: ${GP_CACHE_PATH:-output/web_snapshot.json}
      # 可选：限制启动和刷新时抓取的页数，例如 3
      # GP_MAX_PAGES: 3
    volumes:
      - ./output:/app/output
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
