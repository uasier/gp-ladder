[package]
name = "gp-ladder"
version = "0.2.0"
description = "连涨天梯工作台（桌面 / Android）"
authors = ["you"]
license = "MIT"
edition = "2021"
default-run = "gp-ladder"

[lib]
name = "gp_ladder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "gp-ladder-server"
path = "src/bin/server.rs"
required-features = ["web"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
encoding_rs = "0.8"
html-escape = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "gzip", "charset"] }
tauri = { version = "2", features = [], optional = true }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "fs", "io-util"], optional = true }
tower-http = { version = "0.6", features = ["fs"], optional = true }

[features]
# desktop：Tauri 宿主（macOS / Windows / Android），与 web 服务互斥于默认 feature
default = ["desktop"]
desktop = [
    "dep:tauri",
    "dep:tauri-plugin-opener",
    "dep:tauri-plugin-dialog",
    "dep:tauri-build",
]
web = ["dep:axum", "dep:tokio", "dep:tower-http"]
