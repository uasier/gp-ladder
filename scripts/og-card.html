<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>连涨天梯 OG</title>
    <style>
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        box-sizing: border-box;
        display: flex;
        align-items: center;
        padding: 64px 72px;
        color: #f8fafc;
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
          "Microsoft YaHei", sans-serif;
        background: #0b0f17;
        background-image: radial-gradient(
            920px circle at 12% -8%,
            rgba(56, 189, 248, 0.16),
            transparent 42%
          ),
          radial-gradient(820px circle at 92% 8%, rgba(99, 102, 241, 0.18), transparent 46%);
      }
      .icon {
        width: 176px;
        height: 176px;
        border-radius: 40px;
        background: #151d2c;
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
      }
      .copy {
        margin-left: 56px;
      }
      .eyebrow {
        margin: 0 0 14px;
        color: #94a3b8;
        font-size: 22px;
        letter-spacing: 0.18em;
      }
      h1 {
        margin: 0 0 18px;
        font-size: 92px;
        line-height: 1;
        letter-spacing: 0.06em;
        font-weight: 700;
      }
      p {
        margin: 0 0 32px;
        color: #cbd5e1;
        font-size: 30px;
      }
      .pills {
        display: flex;
        gap: 12px;
      }
      .pill {
        padding: 8px 16px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.04);
        color: #e2e8f0;
        font-size: 22px;
      }
    </style>
  </head>
  <body>
    <img class="icon" src="../public/app-icon.png" alt="" />
    <div class="copy">
      <p class="eyebrow">GP-LADDER</p>
      <h1>连涨天梯</h1>
      <p>A股连涨榜 · 涨停天梯 · 昨日涨停</p>
      <div class="pills">
        <span class="pill">macOS</span>
        <span class="pill">Windows</span>
        <span class="pill">Android</span>
        <span class="pill">开源免费</span>
      </div>
    </div>
  </body>
</html>
